# Author: Nalini Jain
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: linksphere
      POSTGRES_USER: linksphere
      POSTGRES_PASSWORD: linksphere
    ports: ["5432:5432"]
    volumes: [linksphere-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U linksphere -d linksphere"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  linksphere-postgres:
