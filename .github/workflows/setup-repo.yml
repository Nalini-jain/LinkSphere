name: Setup LinkSphere Structure

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-structure:
runs-on: ubuntu-latest
permissions:
  contents: write
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set Git Identity
    run: |
      git config --global user.name "Nalini Jain"
      git config --global user.email "nalini.jain@example.com"

  - name: Create Folders and Files
    run: |
      mkdir -p backend/src/main/java/com/nalinijain/linksphere/controller \
               backend/src/main/java/com/nalinijain/linksphere/repository \
               backend/src/main/java/com/nalinijain/linksphere/service \
               backend/src/main/java/com/nalinijain/linksphere/model \
               backend/src/main/resources \
               frontend/src/components \
               frontend/src/services

      echo "# LinkSphere" > README.md
      echo "Folders auto-generated via GitHub Actions." >> README.md

  - name: Commit and Push Changes
    run: |
      git add .
      git diff --quiet && git diff --staged --quiet || (git commit -m "feat: auto-generate LinkSphere project structure" && git push)
